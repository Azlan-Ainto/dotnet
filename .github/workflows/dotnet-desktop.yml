name: .NET 10 Desktop - MitarbeiterAnalyseTool

on:
  push:
    branches:
      - main

    # ---------------------------------------------------------
    # Workflow zusätzlich bei Versionstags starten
    # Beispiele:
    # v1.0.0
    # v1.0.1
    # v1.1.0
    # ---------------------------------------------------------
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  # Manueller Start über GitHub Actions
  workflow_dispatch:

# -------------------------------------------------------------
# Berechtigungen für GitHub Actions
# contents: write ist für das Erstellen eines GitHub Releases
# und das Hochladen des Release-Assets erforderlich.
# -------------------------------------------------------------
permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'MitarbeiterAnalyseTool.slnx'
  PROJECT_FILE: 'MitarbeiterAnalyseTool/MitarbeiterAnalyseTool.csproj'
  CONFIGURATION: 'Release'
  RUNTIME: 'win-x64'

jobs:

  # ===========================================================
  # JOB 1: BUILD UND TEST
  # ===========================================================
  build:
    name: Build and Test

    runs-on: windows-latest

    steps:

      # ---------------------------------------------------------
      # 1. Repository herunterladen
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. .NET 10 installieren
      # ---------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ---------------------------------------------------------
      # 3. Abhängigkeiten wiederherstellen
      # ---------------------------------------------------------
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # ---------------------------------------------------------
      # 4. Anwendung kompilieren
      # ---------------------------------------------------------
      - name: Build
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore

      # ---------------------------------------------------------
      # 5. Tests ausführen
      # ---------------------------------------------------------
      # Falls kein Testprojekt vorhanden ist, wird der Schritt
      # übersprungen.
      # ---------------------------------------------------------
      - name: Run tests
        shell: pwsh
        run: |
          $testProjects = @(Get-ChildItem `
            -Path . `
            -Filter "*Tests.csproj" `
            -Recurse `
            -ErrorAction SilentlyContinue)

          if ($testProjects.Count -eq 0) {
              Write-Host "Kein Testprojekt gefunden. Testschritt wird übersprungen."
              exit 0
          }

          foreach ($testProject in $testProjects) {

              Write-Host "Führe Tests aus: $($testProject.FullName)"

              dotnet test $testProject.FullName `
                --configuration $env:CONFIGURATION `
                --no-build `
                --verbosity normal

              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

      # ---------------------------------------------------------
      # 6. Anwendung für Windows veröffentlichen
      # ---------------------------------------------------------
      - name: Publish Windows application
        run: >
          dotnet publish ${{ env.PROJECT_FILE }}
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ env.RUNTIME }}
          --self-contained true
          --output ./publish/win-x64

      # ---------------------------------------------------------
      # 7. Veröffentlichtes Programm als ZIP-Datei packen
      # ---------------------------------------------------------
      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "./publish/win-x64/*" `
            -DestinationPath "./MitarbeiterAnalyseTool-win-x64.zip"

      # ---------------------------------------------------------
      # 8. Build-Ergebnis als GitHub Actions Artifact speichern
      # ---------------------------------------------------------
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: MitarbeiterAnalyseTool-win-x64
          path: MitarbeiterAnalyseTool-win-x64.zip
          if-no-files-found: error


  # ===========================================================
  # JOB 2: VERÖFFENTLICHTES PROGRAMM PRÜFEN
  # ===========================================================
  verify:
    name: Verify Published Application

    needs: build

    runs-on: windows-latest

    steps:

      # ---------------------------------------------------------
      # 1. Build-Artefakt herunterladen
      # ---------------------------------------------------------
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: MitarbeiterAnalyseTool-win-x64
          path: ./artifact

      # ---------------------------------------------------------
      # 2. ZIP-Datei entpacken
      # ---------------------------------------------------------
      - name: Extract artifact
        shell: pwsh
        run: |
          Expand-Archive `
            -Path "./artifact/MitarbeiterAnalyseTool-win-x64.zip" `
            -DestinationPath "./verification"

      # ---------------------------------------------------------
      # 3. Prüfen, ob eine EXE-Datei vorhanden ist
      # ---------------------------------------------------------
      - name: Verify executable exists
        shell: pwsh
        run: |

          $exe = @(Get-ChildItem `
            -Path "./verification" `
            -Filter "*.exe" `
            -Recurse)

          if ($exe.Count -eq 0) {
              Write-Error "Keine EXE-Datei gefunden."
              exit 1
          }

          Write-Host "Gefundene Anwendung:"

          $exe | ForEach-Object {
              Write-Host $_.FullName
          }

      # ---------------------------------------------------------
      # 4. Veröffentlichte Dateien anzeigen
      # ---------------------------------------------------------
      - name: Display published files
        shell: pwsh
        run: |

          Get-ChildItem `
            -Path "./verification" `
            -Recurse |
            Select-Object FullName, Length


  # ===========================================================
  # JOB 3: GITHUB RELEASE ERSTELLEN
  # ===========================================================
  release:
    name: Create GitHub Release

    # Release erst erstellen, wenn Build und Verify
    # erfolgreich abgeschlossen wurden.
    needs: verify

    # Nur bei einem Versionstag ausführen.
    # Beispiele:
    # v1.0.0
    # v1.0.1
    # v1.1.0
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: windows-latest

    steps:

      # ---------------------------------------------------------
      # 1. Release-Artefakt herunterladen
      # ---------------------------------------------------------
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: MitarbeiterAnalyseTool-win-x64
          path: ./release

      # ---------------------------------------------------------
      # 2. GitHub Release erstellen
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:

          # -----------------------------------------------------
          # Release-Name
          #
          # Beispiel:
          # Tag: v1.0.0
          # Name: MitarbeiterAnalyseTool v1.0.0
          # -----------------------------------------------------
          name: MitarbeiterAnalyseTool ${{ github.ref_name }}

          # -----------------------------------------------------
          # Fester Release-Inhalt
          # -----------------------------------------------------
          body: |
            ## MitarbeiterAnalyseTool ${{ github.ref_name }}

            **Herausgeber:** Azlan Ainto  
            **Entwickler:** Azlan Ainto  
            **Technologie:** C# / .NET 10  
            **Plattform:** Windows x64  

            ### Beschreibung

            MitarbeiterAnalyseTool ist eine C#/.NET-10-Konsolenanwendung
            zur Verwaltung und Analyse von Mitarbeiterdaten.

            ### Installation

            1. ZIP-Datei herunterladen.
            2. ZIP-Datei entpacken.
            3. Die EXE-Datei starten.

            ### Veröffentlichung

            Diese Version wird als selbstständige Windows-x64-Anwendung
            veröffentlicht.

            © 2026 Azlan Ainto

          # -----------------------------------------------------
          # GitHub erzeugt zusätzlich automatisch Release Notes
          # -----------------------------------------------------
          generate_release_notes: true

          # -----------------------------------------------------
          # ZIP-Datei als Release-Asset hochladen
          # -----------------------------------------------------
          files: ./release/MitarbeiterAnalyseTool-win-x64.zip

          # -----------------------------------------------------
          # Workflow abbrechen, falls das Asset fehlt
          # -----------------------------------------------------
          fail_on_unmatched_files: true
